name: Cursor plugin build

on:
  push:
    branches:
      - cursor
    tags:
      - "v*.*.*"
    paths:
      - ".github/workflows/cursor-plugin-build.yml"
      - "cursor-plugin/**"

permissions:
  contents: write

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cursor-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cursor-plugin/go.mod
          cache-dependency-path: cursor-plugin/go.sum
      - name: Test
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64 plugin
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: linux
        run: go build -trimpath -buildmode=c-shared -o cursor.so .
      - name: Resolve version
        id: version
        shell: bash
        run: |
          version="0.5.6"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Package standalone installer
        run: ./packaging/build-release.sh "${{ steps.version.outputs.version }}"
      - name: Package plugin store asset
        run: ./packaging/build-store-release.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-plugin-${{ steps.version.outputs.version }}-linux-amd64
          path: |
            cursor-plugin/release/cursor-plugin-${{ steps.version.outputs.version }}-linux-amd64.tar.gz
            cursor-plugin/release/cursor_${{ steps.version.outputs.version }}_linux_amd64.zip
            cursor-plugin/release/checksums.txt
          if-no-files-found: error
      - name: Publish plugin store release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "release/cursor_${{ steps.version.outputs.version }}_linux_amd64.zip"
          "release/checksums.txt"
          "release/cursor-plugin-${{ steps.version.outputs.version }}-linux-amd64.tar.gz"
          --repo "$GITHUB_REPOSITORY"
          --title "Cursor plugin $GITHUB_REF_NAME"
          --notes "Unofficial community plugin for user-authorized Cursor accounts. Review DISCLAIMER.md before installation. The cursor_${GITHUB_REF_NAME#v}_linux_amd64.zip asset and checksums.txt follow the CLIProxyAPI official plugin-store format; the tar.gz asset remains available for manual installation."
