name: Cursor plugin build

on:
  push:
    branches:
      - cursor
    paths:
      - ".github/workflows/cursor-plugin-build.yml"
      - "cursor-plugin/**"

permissions:
  contents: read

jobs:
  linux-amd64:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cursor-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cursor-plugin/go.mod
          cache-dependency-path: cursor-plugin/go.sum
      - name: Test
        run: go test -race -shuffle=on -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: Build Linux amd64 plugin
        env:
          CGO_ENABLED: "1"
          GOARCH: amd64
          GOOS: linux
        run: go build -trimpath -buildmode=c-shared -o cursor.so .
      - name: Package
        run: ./packaging/build-release.sh 0.4.0
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-plugin-0.4.0-linux-amd64
          path: cursor-plugin/release/cursor-plugin-0.4.0-linux-amd64.tar.gz
          if-no-files-found: error
